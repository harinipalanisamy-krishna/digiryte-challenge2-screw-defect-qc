name: Build BoltGuard AI Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t boltguard-ai .

      - name: Confirm image was created
        run: docker images boltguard-ai
